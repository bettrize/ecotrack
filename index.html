<style>

4"};

const nf=(v,d=1)=>Number(v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=v=>v==null?"—":(v>0?"+":"")+nf(v)+"%";

const MES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

const RC=[[1,"energia","bolt","","Otimizar o resfriamento dos servidores","Ajustar a temperatura e o fluxo de ar pode reduzir o consumo de energia em até 8%.",8,1],[2,"agua","drop","g","Reuso de água em sistemas de climatização","Implementar reaproveitamento pode gerar economia de até 5% no consumo de água.",5,0],[3,"mat","rec","g","Gestão de materiais e resíduos","Melhorar a separação e o descarte pode reduzir o volume de resíduos em até 10%.",10,1],[4,"energia","bulb","o","Automatização da iluminação","Sensores de presença e controle inteligente podem reduzir o consumo de energia em até 6%.",6,0],[5,"energia","sun","g","Uso de fontes renováveis","Avaliar a instalação de energia solar para reduzir custos e emissões de CO₂.",12,1]];
const E24=[22.6,23.1,25.0,23.2,22.8,23.9,25.6,26.8,24.4,22.9,23.0,24.1],KR={energia:1,agua:160/23.9,mat:1.05/23.9},PV={energia:.948,agua:.962,mat:.929};

/* ===== Banco de dados local (salvo no navegador) ===== */
const KEY="ecotrack_db_v1",SK="ecotrack_ses";

if(!DB||!DB.usuarios)DB={usuarios:[],empresas:[],consumo:[],dispositivos:[],metas:[],planos:[],recs:[],seq:1,simOn:1};

function mkDev(eid,nome,tipo,setor,on){const k=DT[tipo].k,t=tipo=="temp";const d={id:nid(),eid,nome,tipo,setor,on:on?1:0,lim:t?30:+(38*k).toFixed(1),hoje:t?BH.map(()=>+(22+Math.random()*5).toFixed(1)):BH.map(v=>+(v*k).toFixed(2)),hist:Array.from({length:30},(_,i)=>t?+(23+2*Math.sin(i/4)).toFixed(1):+((24+3*Math.sin(i/4)+(i*7%5)*.3)*k).toFixed(2))};DB.dispositivos.push(d);return d}

/* ===== Cálculos ===== */
const anos=()=>[...new Set(CS().map(c=>c.ano))].sort((a,b)=>b-a);
const Y=()=>{const a=anos();return a.includes(yr)?yr:(a[0]||new Date().getFullYear())};
const ser=(ano,rec)=>{const a=Array(12).fill(null);CS().filter(c=>c.ano==ano&&c.rec==rec).forEach(c=>a[c.mes-1]=c.valor);return a};
const sum=a=>a.reduce((s,v)=>s+(v||0),0),cnt=a=>a.filter(v=>v!=null).length;
const tot=(y,r)=>sum(ser(y,r)),avg=(y,r)=>{const s=ser(y,r);return cnt(s)?sum(s)/cnt(s):0};

const brl=v=>v>=1e6?"R$ "+nf(v/1e6,1)+" mi":v>=1e3?"R$ "+nf(v/1e3,1)+" mil":"R$ "+nf(v,0);

const applied=id=>DB.recs.some(r=>r.eid==EID()&&r.rid==id);
function recCalc(only){const y=Y(),pr={energia:0,agua:0,mat:0};let rs=0,co=0;RC.filter(r=>only?applied(r[0]):1).forEach(r=>{rs+=r[6]/100*cost(y,r[1]);pr[r[1]]+=r[6];if(r[1]=="energia")co+=r[6]/100*tot(y,"energia")*1000*EMP().fator});const tc=Object.keys(RS).reduce((s,k)=>s+cost(y,k),0);return{rs,co,pct:tc?rs/tc*100:0,pr}}
function lv(){const vs=Object.keys(RS).map(r=>vr(Y(),r)).filter(v=>v!=null),m=vs.length?sum(vs)/vs.length:0,f=RC.filter(r=>applied(r[0])).length/RC.length,s=Math.round(Math.max(0,Math.min(100,55+25*f+Math.min(20,Math.max(-10,-m*2)))));return[s>=85?"A":s>=70?"B":s>=55?"C":"D",s]}

 if(e.al.alto)for(const r in RS){const s=ser(y,r),ix=s.map((v,i)=>v!=null?i:-1).filter(i=>i>=0);if(ix.length>2){const li=ix[ix.length-1],pv=ix.slice(0,-1).map(i=>s[i]),m=sum(pv)/pv.length,v=(s[li]-m)/m*100;if(v>e.limite)a.push({s:"r",t:`${RS[r].n}: ${MES[li]}/${y} está ${nf(v,0)}% acima da média do ano`})}}

 else if(cf=="a")body=`<div class="g11" style="align-items:start"><div class="card">${ct("bell","Regras de alerta")}${sw("bolt","Alertas de alto consumo","alto")}${sw("gear","Lembretes de manutenção dos dispositivos","manut")}<div class="formrow" style="margin-top:12px">${fld("Alertar quando passar da média em (%)","al_l",e.limite,"number")}<button class="btn p" onclick="saveLim()">Salvar</button></div></div><div class="card">${ct("warn",`Alertas ativos (${al.length})`)}${al.map(a=>`<div class="rw" style="cursor:default"><span class="${a.s=="r"?"bad":""}">●</span><div>${esc(a.t)}</div></div>`).join("")||"<p class=sub>Nenhum alerta no momento.</p>"}</div></div>`;
 else body=`<div class="card">${ct("link","Integrações e dados")}
  <div class="pr">${ic("db",22)}<div><b>Carregar dados públicos de referência</b><small>Meta, 2020 a 2024 (energia e água), do Environmental Data Index 2025. Substitui os dados de consumo atuais.</small></div><button class="btn" onclick="loadMeta()">Carregar</button></div>

  <div class="pr">${ic("db",22)}<div><b>Banco de dados</b><small>Veja as tabelas e os registros salvos.</small></div><a class="btn" href="#banco">Abrir</a></div>
  <div class="pr">${ic("file",22)}<div><b>Backup completo (JSON)</b><small>Baixa todos os dados deste navegador.</small></div><button class="btn" onclick="dl('ecotrack_backup.json',JSON.stringify(DB,null,1),'application/json')">Baixar</button></div>

 return head("Configurações","Gerencie sua conta, empresa, dispositivos, alertas e preferências do sistema.")+seg([["g","Geral","gear"],["e","Empresa","bld"],["u","Usuários","users"],["a","Alertas","bell"],["i","Integrações","link"]],cf,"setCf")+body}

 const rows=T[bt]||[],cols=rows.length?Object.keys(rows[0]):[],cell=v=>Array.isArray(v)?`[${v.length} valores]`:v&&typeof v=="object"?esc(JSON.stringify(v)):esc(v);
 return head("Banco de Dados","Tabelas e registros do sistema.")+
 `<div class="g4">${Object.keys(T).slice(0,4).map(k=>kp("db","",k,T[k].length+" registros")).join("")}</div>${seg(Object.keys(T).map(k=>[k,k]),bt,"setBt")}
 <div class="card"><div class="tw" style="max-height:480px"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${rows.slice(0,150).map(r=>`<tr>${cols.map(c=>`<td>${cell(r[c])}</td>`).join("")}</tr>`).join("")||"<tr><td>Tabela vazia.</td></tr>"}</table></div><small>${rows.length} registro(s). A senha é guardada apenas como hash.</small></div>`}

 post&&post();
